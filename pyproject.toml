[project]
name = "chorus-actors"
version = "0.1.2"
description = "An actor library for Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David Morrison", email = "dm236@st-andrews.ac.uk" }]
requires-python = ">=3.12"
dependencies = []

[project.urls]
Repository = "https://github.com/progspaces/chorus"
Documentation = "https://chorus-actors.readthedocs.io/"
Issues = "https://github.com/progspaces/chorus/issues"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "chorus"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
    "shibuya>=2026.7.12",
    "sphinxcontrib-mermaid>=2.1.1",
]
docs = ["sphinx>=9.1.0"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
