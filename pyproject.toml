[project]
name = "chorus-actors"
version = "0.1.4"
description = "An actor library for Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David Morrison", email = "dm236@st-andrews.ac.uk" }]
requires-python = ">=3.12"
dependencies = []

[project.urls]
Repository = "https://github.com/progspaces/chorus"
Documentation = "https://chorus-actors.readthedocs.io/"
Issues = "https://github.com/progspaces/chorus/issues"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "chorus"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
    "shibuya>=2026.7.12",
    "sphinxcontrib-mermaid>=2.1.1",
]
docs = ["sphinx>=9.1.0"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 88

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
extend-select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # Pyflakes
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "C4",     # flake8-comprehensions
    "I",      # isort
    "N",      # pep8-naming
    "D",      # pydocstyle
    "S",      # flake8-bandit
    "T20",    # flake8-print
    "PT",     # flake8-pytest-style
]
ignore = [
    "D1",     # missing docstrings
    "S101",   # use of assert
]

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["T20"]  # print statements allowed in examples
