[project]
name = "chorus-actors"
version = "0.1.4"
description = "An actor library for Python"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "David Morrison", email = "dm236@st-andrews.ac.uk" }]
requires-python = ">=3.12"
dependencies = []

[project.urls]
Repository = "https://github.com/progspaces/chorus"
Documentation = "https://chorus-actors.readthedocs.io/"
Issues = "https://github.com/progspaces/chorus/issues"

[build-system]
requires = ["uv_build>=0.11.13,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "chorus"

[dependency-groups]
dev = [
    "matplotlib>=3.11.2",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "ruff>=0.15.21",
    "shibuya>=2026.7.12",
    "sphinxcontrib-mermaid>=2.1.1",
]
docs = ["sphinx>=9.1.0"]

[tool.mypy]
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
line-length = 88
exclude = ["docs"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
extend-select = [
    # Recommended Ruff defaults from pydevtools.com
    "F",        # Pyflakes rules
    "W",        # PyCodeStyle warnings
    "E",        # PyCodeStyle errors
    "I",        # Sort imports properly
    "UP",       # Warn if certain things can changed due to newer Python versions
    "C4",       # Catch incorrect use of comprehensions, dict, list, etc
    "FA",       # Enforce from __future__ import annotations
    "ISC",      # Good use of string concatenation
    "ICN",      # Use common import conventions
    "RET",      # Good return practices
    "SIM",      # Common simplification rules
    "TID",      # Some good import practices
    "TC",       # Enforce importing certain types in a TYPE_CHECKING block
    "PTH",      # Use pathlib instead of os.path
    "TD",       # Be diligent with TODO comments
    "NPY",      # Some numpy-specific things
    "FURB",     # Suggest more idiomatic Python patterns

    # Some additional rules
    "A",        # flake8-builtins
    "B",        # flake8-bugbear
    "N",        # pep8-naming
    "D",        # pydocstyle
    "S",        # flake8-bandit
    "T20",      # flake8-print
    "PT",       # flake8-pytest-style
]
ignore = [
    "D1",     # Missing docstrings
    "S101",   # Use of assert
    "TD002",  # Missing author in TODO
    "TD003",  # Missing issue link in TODO
]

[tool.ruff.lint.per-file-ignores]
"examples/**" = ["T20"]


[tool.ruff.lint.pydocstyle]
convention = "google"
