name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      - run: uv sync --locked
      - run: uv run --locked pytest
      - run: uv build --no-sources
      - run: uv run --locked --group docs sphinx-build -b html -W docs/source docs/_build/html

      - name: Check installed wheel
        run: |
          uv venv --python 3.12 .venv-wheel
          uv pip install --python .venv-wheel/bin/python --no-deps dist/*.whl
          .venv-wheel/bin/python -I -c "from chorus import ActorSystem, Response, spawn_server_with_proxy; from importlib.metadata import version; print(version('chorus-actors'))"
