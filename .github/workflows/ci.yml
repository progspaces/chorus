name: Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - run: uv sync --locked
      - run: uv run --locked pytest
      - run: uv build --no-sources
      - run: uv run --group docs sphinx-build -b html -W docs docs/_build/html